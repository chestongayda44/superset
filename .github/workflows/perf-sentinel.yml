name: Perf Sentinel — trigger on perf-regression label

on:
  issues:
    types: [labeled]

# Least privilege: this workflow only makes an outbound call and does not
# need any access to repository contents or the GITHUB_TOKEN.
permissions: {}

jobs:
  trigger-perf-sentinel:
    if: >
      github.event.label.name == 'perf-regression' ||
      github.event.label.name == 'perf-sentinel' ||
      github.event.label.name == 'performance'
    runs-on: ubuntu-latest

    steps:
      - name: Call Perf Sentinel orchestrator
        env:
          PERF_SENTINEL_URL: ${{ secrets.PERF_SENTINEL_URL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -X POST \
            "${PERF_SENTINEL_URL}/trigger/${ISSUE_NUMBER}" \
            -H "Content-Type: application/json"
